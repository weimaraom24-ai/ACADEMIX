 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <title>ACADEMIX</title>
    <link rel="stylesheet" href="estilos.css?v=2">
</head>
<body>

<!-- Entrada principal: ofrece autenticación y registro con campos dependientes del rol. -->

<div class="contenedor">

    <aside class="izquierda">
        <div class="logo-header">
            <img src="logo.jpg" alt="Logo de Academix">
            <div>
                <p class="marca">ACADEMIX</p>
                <span>Educación digital organizada</span>
            </div>
        </div>

        <div class="bienvenida">
            <h1>Bienvenido a ACADEMIX</h1>
            <p>Plataforma educativa para estudiantes, docentes y administradores</p>
            <div class="botones-bienvenida" style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;">
                <button class="btn-auth" type="button" onclick="abrirFormulario('login')">Iniciar Sesión</button>
                <button class="btn-auth" type="button" onclick="abrirFormulario('registro')">Registrarse</button>
            </div>
        </div>
    </aside>

    <main class="derecha" hidden></main>
</div>

<!-- Modal que alterna entre los formularios de autenticación y registro. -->
<div id="formModal" class="modal-form-overlay" hidden>
    <div class="modal-form-card">
        <div class="tabs">
            <button id="tabLogin" class="active" onclick="mostrar('login', this)">Iniciar Sesión</button>
            <button id="tabRegistro" onclick="mostrar('registro', this)">Registrarse</button>
        </div>

        <div id="login" class="formulario activo">

    <div class="form-header">
        <h2>Iniciar Sesión</h2>
        <button type="button" onclick="cerrarFormulario()">×</button>
    </div>

    <form action="login.php" method="POST">

        <div class="campo">
            <label for="rolLogin">Rol</label>

            <select id="rolLogin" name="rol" required>
                <option value="">Selecciona tu rol</option>
                <option value="estudiante">Estudiante</option>
                <option value="docente">Docente</option>
                <option value="admin">Administrador</option>
            </select>
        </div>

        <div class="campo">
            <label for="emailLogin">Correo</label>

            <input 
                id="emailLogin"
                name="correo"
                type="email"
                placeholder="Correo"
                required
            >
        </div>

        <div class="campo">
            <label for="passwordLogin">Contraseña</label>

            <input 
                id="passwordLogin"
                name="password"
                type="password"
                placeholder="Contraseña"
                required
            >
        </div>

        <button type="submit">Ingresar</button>

    </form>

</div>

       <div id="registro" class="formulario">
    <div class="form-header">
        <h2>Registrarse</h2>
        <button type="button" onclick="cerrarFormulario()">×</button>
    </div>

    <form action="registrar.php" method="POST">

        <div class="campo">
            <label for="rolRegistro">Rol</label>
            <select id="rolRegistro" name="rol" required>
                <option value="">Selecciona tu rol</option>
                <option value="estudiante">Estudiante</option>
                <option value="docente">Docente</option>
                <option value="admin">Administrador</option>
            </select>
        </div>

        <!-- El grado se solicita a estudiantes y se guarda como grupo escolar. -->
        <div class="campo" id="grupoRegistroCampo">
            <label for="grupoRegistro">Grado</label>
            <select id="grupoRegistro" name="grupo">
                <option value="">Selecciona tu grado</option>
                <option value="10-1">10-1</option>
                <option value="10-2">10-2</option>
                <option value="10-3">10-3</option>
                <option value="10-4">10-4</option>
                <option value="10-5">10-5</option>
                <option value="10-6">10-6</option>
                <option value="10-7">10-7</option>
                <option value="11-1">11-1</option>
                <option value="11-2">11-2</option>
                <option value="11-3">11-3</option>
                <option value="11-4">11-4</option>
                <option value="11-5">11-5</option>
                <option value="11-6">11-6</option>
                <option value="11-7">11-7</option>
            </select>
        </div>

        <!-- La materia de adscripción solo aplica a cuentas docentes. -->
        <div class="campo" id="materiaRegistroCampo" hidden>
    <label for="materiaRegistro">Materia</label>
    <select id="materiaRegistro" name="materia">
        <option value="">Selecciona tu materia</option>
        <option value="Lectura Critica">Lectura Critica</option>
        <option value="Matematicas">Matematicas</option>
        <option value="Ciencias Naturales">Ciencias Naturales</option>
        <option value="Competencias Ciudadanas">Competencias Ciudadanas</option>
        <option value="Ingles">Ingles</option>
    </select>
</div>

        <div class="campo">
            <label for="nombreRegistro">Nombre</label>
            <input id="nombreRegistro" type="text" name="nombre" placeholder="Nombre" required>
        </div>

        <div class="campo">
            <label for="apellidoRegistro">Apellido</label>
            <input id="apellidoRegistro" type="text" name="apellido" placeholder="Apellido" required>
        </div>

        <div class="campo">
            <label for="correoRegistro">Correo</label>
            <input id="correoRegistro" type="email" name="correo" placeholder="Correo" required>
        </div>

        <div class="campo">
            <label for="documentoRegistro">Documento</label>
            <input id="documentoRegistro" type="text" name="documento" placeholder="Documento" required>
        </div>

        <div class="campo">
            <label for="passwordRegistro">Contraseña</label>
            <input id="passwordRegistro" type="password" name="password" placeholder="Contraseña" required>
        </div>

        <button type="submit">Registrarse</button>

    </form>
</div>

<script>
// Cambia el formulario visible y marca la pestaña seleccionada.
function mostrar(tipo, boton) {
    document.getElementById("login").classList.remove("activo");
    document.getElementById("registro").classList.remove("activo");
    document.getElementById(tipo).classList.add("activo");

    document.querySelectorAll('.tabs button').forEach(function(el) {
        el.classList.remove('active');
    });
    boton.classList.add('active');
}


// Abre el modal en modo de ingreso o de registro.
function abrirFormulario(tipo) {
    const modal = document.getElementById('formModal');
    const tabsDiv = modal ? modal.querySelector('.tabs') : null;
    if (modal) {
        modal.removeAttribute('hidden');
        if (tipo === 'login') {
            if (tabsDiv) tabsDiv.style.display = 'none';
            mostrar('login', document.getElementById('tabLogin'));
        } else if (tipo === 'registro') {
            if (tabsDiv) tabsDiv.style.display = 'grid';
            mostrar('registro', document.getElementById('tabRegistro'));
        }
    }
}

// Oculta el modal sin enviar los formularios.
function cerrarFormulario() {
    const modal = document.getElementById('formModal');
    if (modal) modal.setAttribute('hidden', '');
}

// Exige y presenta grado a estudiantes o materia a docentes, según el rol elegido.
const rolRegistro = document.getElementById('rolRegistro');
const grupoRegistro = document.getElementById('grupoRegistro');
const grupoRegistroCampo = document.getElementById('grupoRegistroCampo');
const materiaRegistro = document.getElementById('materiaRegistro');
const materiaRegistroCampo = document.getElementById('materiaRegistroCampo');

rolRegistro.addEventListener('change', function() { 
    const esEstudiante = rolRegistro.value === 'estudiante';
    const esDocente = rolRegistro.value === 'docente';

    grupoRegistroCampo.hidden = !esEstudiante;
    materiaRegistroCampo.hidden = !esDocente;

    grupoRegistro.required = esEstudiante;
    materiaRegistro.required = esDocente;

    if (!esEstudiante) {
        grupoRegistro.value = "";
    }

    if (!esDocente) {
        materiaRegistro.value = "";
    }
});

</script>
</body>
</html>
